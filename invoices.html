<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pharmacy/invoice</title>
</head>
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; }
header, footer { background:#2e7d32; color:white; text-align:center; padding:10px; }
aside { width:180px; background:#f0f0f0; float:left; height:100vh; padding:10px; }
aside nav a { display:block; padding:6px; margin:4px 0; text-decoration:none; color:#2e7d32; }
main { margin-left:200px; padding:15px; }
h2 { color:#ad1457; }
form label { display:inline-block; width:120px; font-weight:bold; }
input, textarea, button { margin:5px 0; padding:5px; }
table { width:100%; border-collapse:collapse; margin-top:10px; }
th, td { border:1px solid #ccc; padding:6px; text-align:left; }
button { background:#2e7d32; color:white; border:none; padding:6px 12px; cursor:pointer; }
button:hover { background:#1b5e20; }
</style>
<body>
     <header>
        <h1>Pharmacy Management System</h1>
    </header>
   <aside>
  <nav>
    <a href="drugs.html">Drugs</a>
    <a href="suppliers.html">Suppliers</a>
    <a href="employees.html">Employees</a>
    <a href="invoices.html">Invoices</a>
    <a href="patients.html">Patients</a>
    <a href="diseases.html">Diseases</a>
    <a href="insurance.html">Insurance</a>
  </nav>
</aside>
<main>

    <section id="invoice">
      <h2>Invoices</h2>
      <form action="addInvoice.php" method="post">
        <label>Patient ID</label>
        <input type="number" name="patient_id"><br><br>
        <label>Amount</label>
        <input type="number" name="amount"><br><br>
        <button type="submit">Add</button>
      </form>
      <h3>Invoices List</h3>
      <table>
        <thead>
          <tr><th>Patient ID</th><th>Amount</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    </main>
      <footer>
    <p>&copy; 2026 myPharmacy.</p>
  </footer>

<script>
document.querySelector("#invoice form").addEventListener("submit", function(e) {
  e.preventDefault();
  const table = document.querySelector("#invoice table tbody");
  const row = document.createElement("tr");
  row.innerHTML = `
    <td>${Date.now()}</td>
    <td>${this.date.value}</td>
    <td>${this.dose.value}</td>
    <td>${this.patient_id.value}</td>
  `;
  table.appendChild(row);
  this.reset();
});
</script>
</body>
</html>
