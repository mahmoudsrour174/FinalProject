<html lang="en">
<head>

</head>
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; }
header, footer { background:#2e7d32; color:white; text-align:center; padding:10px; }
aside { width:180px; background:#f0f0f0; float:left; height:100vh; padding:10px; }
aside nav a { display:block; padding:6px; margin:4px 0; text-decoration:none; color:#2e7d32; }
main { margin-left:200px; padding:15px; }
h2 { color:#1565c0; }
form label { display:inline-block; width:120px; font-weight:bold; }
input, textarea, button { margin:5px 0; padding:5px; }
table { width:100%; border-collapse:collapse; margin-top:10px; }
th, td { border:1px solid #ccc; padding:6px; text-align:left; }
button { background:#2e7d32; color:white; border:none; padding:6px 12px; cursor:pointer; }
button:hover { background:#1b5e20; }
</style>
<body>
    <header>
        <h1>Pharmacy Management System</h1>
    </header>
   <aside>
  <nav>
    <a href="drugs.html">Drugs</a>
    <a href="suppliers.html">Suppliers</a>
    <a href="employees.html">Employees</a>
    <a href="invoices.html">Invoices</a>
    <a href="patients.html">Patients</a>
    <a href="diseases.html">Diseases</a>
    <a href="insurance.html">Insurance</a>
  </nav>
</aside>

<main>
   <section id="employee">
      <h2>Employees</h2>
      <form action="addEmployee.php" method="post">
        <label>Name</label><input type="text" name="name"><br><br>
        <label>Phone</label><input type="text" name="phone"><br><br>
        <label>Address</label><input type="text" name="address"><br><br>
        <label>Job</label><input type="text" name="job"><br><br>
        <label>Salary</label><input type="number" name="salary"><br><br>
        <label>Presence</label><input type="text" name="presence"><br><br>
        <button type="submit">Add Employee</button>
      </form>
      <h3>Employee List</h3>
      <table>
        <thead>
          <tr><th>Name</th><th>Phone</th><th>Job</th><th>Salary</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>


    </main>
      <footer>
    <p>&copy; 2026 myPharmacy.</p>
  </footer>
    <script>
document.querySelector("#employee form").addEventListener("submit", function(e) {
  e.preventDefault();
  const table = document.querySelector("#employee table tbody");
  const row = document.createElement("tr");
  row.innerHTML = `
    <td>${this.name.value}</td>
    <td>${this.phone.value}</td>
    <td>${this.job.value}</td>
    <td>${this.salary.value}</td>
  `;
  table.appendChild(row);
  this.reset();
});
</script>
</body>
