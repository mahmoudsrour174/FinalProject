<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Pharmacy</title>

  <style>
    header {
      background: #2e8b57;
      color: white;
      text-align: center;
      padding: 15px;
    }

    input, button {
      width: 40%;
      padding: 8px;
    }

    button {
      background: #2e8b57;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #246b45;
    }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>My Pharmacy</h1>
</header>

<center>

 
  <h2>Add Drug</h2>
  <form action="insert.php" method="POST" name="add">
    <input type="text" name="name" placeholder="Drug Name" required><br><br>
    <input type="number" name="price" placeholder="Price" required><br><br>
    <button type="submit">Save</button>
  </form>

  <br><br>

  
  <h2>Login</h2>
  <form action="login.php" method="POST" name="login">
    <input type="text" name="username" placeholder="Username" required><br><br>
    <input type="password" name="password" placeholder="Password" required><br><br>
    <button type="submit">Login</button>
  </form>

</center>

<footer>
  <p>&copy; 2026 mypharmacy</p>
</footer>

</body>
</html>
